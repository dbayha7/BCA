<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="dq-plot-title dq-plot-desc">
<title id="dq-plot-title">Sparse selection gains do not establish adaptive benefit</title>
<desc id="dq-plot-desc">Mean selected true-Q changes against raw Q. Intervals are paired state bootstrap intervals. The common-grid interval is unavailable because some eligible strata contain one state.</desc>
<rect width="1000" height="410" fill="#fbfaf7"/><g font-family="Arial,sans-serif" fill="#182d36">
<text x="24" y="32" font-size="23" font-weight="bold">The width changes one full-bank choice</text>
<text x="24" y="59" font-size="15">Mean true-Q change versus raw Q; one action, then the original actor</text>
<line x1="386.50" x2="386.50" y1="82" y2="326" stroke="#536571" stroke-dasharray="4 4"/>
<text x="24" y="105" font-size="15">All candidates · width</text>
<line x1="386.50" x2="670.29" y1="100" y2="100" stroke="#167d73" stroke-width="4"/>
<circle cx="481.10" cy="100" r="6" fill="#167d73"/>
<text x="325" y="125" font-size="13">+0.1538; 1 better / 0 worse / 31 unchanged</text>
<text x="24" y="167" font-size="15">All candidates · distance</text>
<line x1="434.17" x2="884.39" y1="162" y2="162" stroke="#3f648d" stroke-width="4"/>
<circle cx="635.81" cy="162" r="6" fill="#3f648d"/>
<text x="325" y="187" font-size="13">+0.4054; 4 better / 0 worse / 28 unchanged</text>
<text x="24" y="229" font-size="15">Common grid only · width</text>
<circle cx="372.31" cy="224" r="6" fill="#a35649"/>
<text x="325" y="249" font-size="13">-0.0231; 0 better / 1 worse / 12 unchanged · interval unavailable</text>
<text x="24" y="291" font-size="15">Unsupported only · width</text>
<line x1="386.50" x2="403.59" y1="286" y2="286" stroke="#7762a3" stroke-width="4"/>
<circle cx="395.05" cy="286" r="6" fill="#7762a3"/>
<text x="325" y="311" font-size="13">+0.0139; 1 better / 0 worse / 31 unchanged</text>
<text x="386.50" y="348" font-size="13" text-anchor="middle">0.0</text>
<text x="509.50" y="348" font-size="13" text-anchor="middle">0.2</text>
<text x="632.50" y="348" font-size="13" text-anchor="middle">0.4</text>
<text x="755.50" y="348" font-size="13" text-anchor="middle">0.6</text>
<text x="878.50" y="348" font-size="13" text-anchor="middle">0.8</text>
<text x="325" y="374" font-size="13">Distance comparison is descriptive; no direct superiority test against width was planned.</text>
<text x="325" y="395" font-size="13">Conditional evidence from 32 states, tiny strata and one trained checkpoint.</text></g></svg>
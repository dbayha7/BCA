<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" role="img" aria-labelledby="fr-chart-title fr-chart-desc">
<title id="fr-chart-title">Fresh-bank alignment contrasts and ranking change</title>
<desc id="fr-chart-desc">Points are state means; lines are descriptive95percent bootstrap intervals. Zero marks no paired difference.</desc>
<rect width="900" height="245" fill="#fbfaf7"/>
<line x1="749.94" y1="24" x2="749.94" y2="183" stroke="#777" stroke-dasharray="4 4"/>
<text x="15" y="50" font-family="sans-serif" font-size="16" fill="#222">Width - distance correlation</text>
<line x1="411.28" y1="45" x2="747.00" y2="45" stroke="#147d73" stroke-width="3"/>
<circle cx="574.91" cy="45" r="6" fill="#147d73"/>
<text x="15" y="105" font-family="sans-serif" font-size="16" fill="#222">Width - shuffled correlation</text>
<line x1="359.35" y1="100" x2="770.65" y2="100" stroke="#147d73" stroke-width="3"/>
<circle cx="565.08" cy="100" r="6" fill="#147d73"/>
<text x="15" y="160" font-family="sans-serif" font-size="16" fill="#222">Width concordance change</text>
<line x1="742.06" y1="155" x2="758.60" y2="155" stroke="#147d73" stroke-width="3"/>
<circle cx="750.67" cy="155" r="6" fill="#147d73"/>
<text x="310.00" y="210" font-family="sans-serif" font-size="14">-0.316</text>
<text x="749.94" y="210" text-anchor="middle" font-family="sans-serif" font-size="14">0</text>
<text x="820.00" y="210" text-anchor="end" font-family="sans-serif" font-size="14">0.050</text>
</svg>
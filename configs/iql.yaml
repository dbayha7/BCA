# Dataset arms are an explicit allow-list; {} inherits the named arm.
# bca: true also inherits the BCA defaults at algorithm and dataset scope.
host: iql
defaults:
  host: iql
  environment: '{environment}'
  expected_counts:
    host_updates: 1000000
    q_updates: 1000000
    value_updates: 1000000
    per_actor_attempted_updates: 1000000
    per_actor_accepted_updates: measured; valid unsupported inputs may skip
    periodic_banks_per_actor: 200
    periodic_episodes_per_actor: 400
    final_episodes_per_actor: 20
  cache: {}
  options:
    dataset: '{environment}'
    seed: '{seed}'
    output_dir: '{output_dir}'
    scope: development
    updates: '{experiment.num_updates}'
    eval_interval: '{experiment.eval_interval}'
    curve_episodes: 2
    final_episodes: '{experiment.final_episodes}'
    warmup: '{experiment.warmup}'
    refresh_interval: '{experiment.refresh_interval}'
    eval_seed: 20260920
    prepare_only: false
  spaces: {}
  declared:
    args:
      seed: '{seed}'
      dataset: '{environment}'
      num_updates: '{experiment.num_updates}'
      reward_transform: rebrac_x100
      reward_scale: 10.0
      reward_bias: -5.0
      allow_off_config: false
      eval_interval: '{experiment.eval_interval}'
      eval_workers: 2
      eval_final_episodes: '{experiment.final_episodes}'
      log: false
      wandb_project: unifloral
      wandb_team: flair
      wandb_group: debug
      vf_lr: 0.0003
      qf_lr: 0.0003
      actor_lr: 0.0003
      batch_size: 256
      discount: 0.99
      normalize: true
      beta: 3.0
      posterior:
        reserve_seed: 911
        reserve_max_fraction: 0.25
        alpha: 0.1
        credibility: 0.95
        draws: 128
        warmup: '{experiment.warmup}'
        refresh_interval: '{experiment.refresh_interval}'
        fit_size: 4096
        decision_gain: 1.0
        cond_mode: state_action
        use_bootstrap: true
        cal_beta: 20.0
        cal_lambda_width: 0.005
        cal_lr: 0.001
        cal_hidden_dim: 64
        balance_coverage: true
        balance_weight: 0.5
  training_seed: '{seed}'
arms:
  native:
    expected_counts:
      posterior_refresh_events: 0
    options:
      mode: native
      reserve_size: 0
    mode: native
    actor_count: 1
    scale_variant_count: 0
    refresh_steps: []
    run_id: fullwidth-1m-iql-v1-{environment}-s{seed}-native
    declared:
      args:
        algorithm: corl_iql_native_full_data
        posterior:
          mode: 'off'
          reserve_size: 0
      arms:
      - name: native_full_data
        mode: 'off'
        beta: 3.0
        gain: 1.0
      published_differences:
      - arm: native_full_data
        actual_differences: []
        declaration: development horizon and listed native beta control only
  shared:
    expected_counts:
      posterior_refresh_events: 198
    options:
      mode: shared
      decision_gain: 1.0
    mode: shared
    actor_count: 8
    scale_variant_count: 5
    refresh_steps:
      bank: refresh_steps
    run_id: fullwidth-1m-iql-v1-{environment}-s{seed}-shared
    declared:
      args:
        algorithm: corl_iql_shared_scale_iw_matched_host
        posterior:
          mode: full
      variants:
      - name: noiw_legacy_width
        iw:
          mode: 'off'
          beta: 3.0
          cap: 100.0
          mixing: 1.0
          ess_floor: 0.25
          tau_min: 0.05
          iterations: 32
        weight_width: false
      - name: noiw_weighted_width
        iw:
          mode: 'off'
          beta: 3.0
          cap: 100.0
          mixing: 1.0
          ess_floor: 0.25
          tau_min: 0.05
          iterations: 32
        weight_width: true
      - name: awr_legacy_width
        iw:
          mode: awr
          beta: 3.0
          cap: 100.0
          mixing: 1.0
          ess_floor: 0.25
          tau_min: 0.05
          iterations: 32
        weight_width: false
      - name: awr_weighted_width
        iw:
          mode: awr
          beta: 3.0
          cap: 100.0
          mixing: 1.0
          ess_floor: 0.25
          tau_min: 0.05
          iterations: 32
        weight_width: true
      - name: awr_permuted_weighted_width
        iw:
          mode: awr_permuted
          beta: 3.0
          cap: 100.0
          mixing: 1.0
          ess_floor: 0.25
          tau_min: 0.05
          iterations: 32
        weight_width: true

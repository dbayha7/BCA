algorithm: iql
host:
  reward_transform: rebrac_x100
  reward_scale: 10.0
  reward_bias: -5.0
  vf_lr: 0.0003
  qf_lr: 0.0003
  actor_lr: 0.0003
  batch_size: 256
  discount: 0.99
  normalize: true
  beta: 3.0
bca:
  alpha: 0.1
  credibility: 0.95
  draws: 1000
  decision_gain: 1.0
  cond_mode: state_action
  use_bootstrap: true
  cal_beta: 20.0
  cal_lambda_width: 0.005
  cal_lr: 0.001
  cal_hidden_dim: 64
  balance_coverage: true
  balance_weight: 0.5
reservation:
  # rows_per_episode (per dataset): K calibration rows from each withheld episode; the
  # smallest K >= 5 that keeps withheld rows within max_fraction for 1,000 simulated seeds
  # (experiments/wbcp/choose_rows_per_episode.py; DEPENDENCE.md, Change 9).
  # Whether a bank meets the 5% budget is measured per host, dataset, K, n and score: see
  # dependence_evidence in the resolved bca row (calibration/dependence_evidence.json).
  seed: 911
  max_fraction: 0.25

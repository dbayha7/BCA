# Dataset arms are an explicit allow-list; {} inherits the named arm.
# bca: true also inherits the BCA defaults at algorithm and dataset scope.
host: rebrac
defaults:
  host: rebrac
  environment: '{environment}'
  native_args:
    actor_ln: false
    actor_n_hiddens: 3
    algorithm: corl_rebrac
    allow_off_config: true
    critic_ln: true
    critic_n_hiddens: 3
    dataset: '{environment}'
    eval_final_episodes: '{experiment.final_episodes}'
    eval_interval: '{experiment.eval_interval}'
    eval_workers: 10
    gamma: 0.99
    hidden_dim: 256
    log: false
    noise_clip: 0.5
    normalize_q: true
    normalize_reward: false
    normalize_states: false
    num_updates: '{experiment.num_updates}'
    policy_freq: 2
    policy_noise: 0.2
    reward_bias: -5.0
    reward_scale: 10.0
    reward_transform: rebrac_x100
    seed: '{seed}'
    tau: 0.005
    wandb_group: debug
    wandb_project: unifloral
    wandb_team: flair
  specification:
    configuration_class: declared_deviation
    purpose: comparison
  protocol:
    eval_final_episodes: '{experiment.final_episodes}'
    eval_interval: '{experiment.eval_interval}'
    eval_periodic_episodes: 10
    eval_workers: 10
    evaluation_events:
      bank: '{evaluation_bank}'
    num_updates: '{experiment.num_updates}'
    scan_block_size: '{experiment.scan_block_size}'
    seed: '{seed}'
  action_bound: 1.0
  expected_counts:
    host_updates: 1000000
    updates_per_critic: 1000000
    actor_updates: 500000
    periodic_evaluations: 200
    final_episodes: '{experiment.final_episodes}'
    checkpoint_steps: [10000, 50000, 1000000]
  cache: {}
  training_seed: '{seed}'
bca_defaults:
  specification:
    constant_bc_multiplier: null
    posterior:
      affinity: {}
      alpha: 0.1
      blend: 0.5
      cal_beta: 20.0
      cal_lr: 0.001
      credibility: 0.95
      draws: 128
      scale_ema: 0.99
      width_penalty: 0.005
  protocol:
    reference:
      seed: 912
      size: 1024
    refresh_events: {}
    reservation:
      dependency_contract: raw_effective_finite_targets_next_actions_v1
      max_fraction: 0.1
      seed: 911
  expected_counts:
    refresh_events: 198
  seed_overrides:
    202609171:
      protocol:
        refresh_events:
          bank: refresh_seed_1
    202609172:
      protocol:
        refresh_events:
          bank: refresh_seed_2
    202609173:
      protocol:
        refresh_events:
          bank: refresh_seed_3
    202609174:
      protocol:
        refresh_events:
          bank: refresh_seed_4
    202609175:
      protocol:
        refresh_events:
          bank: refresh_seed_5
arms:
  constant_1p5:
    identity: constant_bc_pool
    specification:
      constant_bc_multiplier: 1.5
      identity: constant_bc_pool
      posterior: null
    protocol:
      reference: null
      refresh_events: []
      reservation:
        dependency_contract: raw_effective_finite_targets_next_actions_v1
        max_fraction: 0.1
        seed: 911
    expected_counts:
      refresh_events: 0
  fixed_after_warmup:
    identity: constant_bc_pool

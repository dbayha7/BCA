        width_objective: matched
        affinity:
          mode: affinity
          ess_floor: 0.25
          tau_min: 0.0
          iterations: 32
      constant_bc_start_step: 0
    protocol:
      run_id: fullwidth-1m-v1-td3-{environment}-s{seed}-posterior_affinity_dose_permuted
      reservation:
        target_size: 1024
    run_id: fullwidth-1m-v1-td3-{environment}-s{seed}-posterior_affinity_dose_permuted
  posterior_affinity_permuted:
    bca: true
    identity: posterior_affinity_permuted
    specification:
      identity: posterior_affinity_permuted
      posterior:
        width_objective: matched
        affinity:
          mode: affinity_permuted
          ess_floor: 0.25
          tau_min: 0.0
          iterations: 32
  posterior_matched_noiw:
    bca: true
    identity: posterior_matched_noiw
    specification:
      identity: posterior_matched_noiw
      posterior:
        width_objective: matched
        affinity:
          mode: 'off'
          bandwidth: null
          ess_floor: null
          tau_min: null
          iterations: null
  posterior_original_noiw:
    bca: true
    identity: posterior_original_noiw
    specification:
      identity: posterior_original_noiw
      posterior:
        width_objective: original
        affinity:

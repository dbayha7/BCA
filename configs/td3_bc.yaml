algorithm: td3_bc
host:
  reward_transform: rebrac_x100
  reward_scale: 10.0
  reward_bias: -5.0
  lr: 0.0003
  batch_size: 256
  discount: 0.99
  tau: 0.005
  normalize: true
  normalize_reward: false
  alpha: 2.5
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
bca:
  alpha: 0.1
  credibility: 0.95
  draws: 1000
  blend: 0.5
  cal_lr: 0.001
  cal_beta: 20.0
  width_penalty: 0.005
  scale_ema: 0.99
reservation:
  # rows_per_episode (per dataset): K calibration rows from each withheld episode; the
  # smallest K >= 5 that keeps withheld rows within max_fraction for 1,000 simulated seeds
  # (experiments/wbcp/choose_rows_per_episode.py; DEPENDENCE.md, Change 9).
  seed: 911
  max_fraction: 0.1
datasets:
  halfcheetah:
    environment: halfcheetah-medium-expert-v2
    cache:
      sha256: 015db75dae5bbe8e94029b71fa0bafc2073365df0c94744e71031189f3f79c06
      filename: halfcheetah_medium_expert-v2.hdf5
    reservation:
      size: 1024
      rows_per_episode: 6
    refresh_banks: [refresh_seed_1, refresh_seed_2, refresh_seed_3, refresh_seed_4, refresh_seed_5]
    max_episode_steps: 1000
  hopper:
    environment: hopper-medium-v2
    cache:

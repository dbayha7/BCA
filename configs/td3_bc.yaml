# Dataset arms are an explicit allow-list; {} inherits the named arm.
# bca: true also inherits the BCA defaults at algorithm and dataset scope.
host: td3
defaults:
  host: td3
  environment: '{environment}'
  native_args:
    seed: '{seed}'
    dataset: '{environment}'
    algorithm: corl_td3_bc
    num_updates: '{experiment.num_updates}'
    reward_transform: rebrac_x100
    reward_scale: 10.0
    reward_bias: -5.0
    allow_off_config: true
    eval_interval: '{experiment.eval_interval}'
    eval_workers: 10
    eval_final_episodes: '{experiment.final_episodes}'
    log: false
    wandb_project: unifloral
    wandb_team: flair
    wandb_group: debug
    lr: 0.0003
    batch_size: 256
    discount: 0.99
    tau: 0.005
    normalize: true
    normalize_reward: false
    alpha: 2.5
    policy_noise: 0.2
    noise_clip: 0.5
    policy_freq: 2
  specification:
    configuration_class: declared_deviation
  protocol:
    seed: '{seed}'
    num_updates: '{experiment.num_updates}'
    scan_block_size: '{experiment.scan_block_size}'
    eval_interval: '{experiment.eval_interval}'
    eval_workers: 10
    eval_periodic_episodes: 10
    eval_final_episodes: '{experiment.final_episodes}'
    evaluation_events:
      bank: '{evaluation_bank}'
  expected_counts:
    host_updates: 1000000
    updates_per_critic: 1000000
    actor_updates: 500000
    periodic_evaluations: 200
    final_episodes: '{experiment.final_episodes}'
    checkpoint_steps: [10000, 50000, 1000000]
  cache: {}
  action:
    max_action: 1.0
    rms_bandwidth_grid: [0.05, 0.15, 0.45]
  training_seed: '{seed}'
bca_defaults:
  specification:
    posterior:
      alpha: 0.1
      credibility: 0.95
      draws: 128
      blend: 0.5
      cal_lr: 0.001
      cal_beta: 20.0
      width_penalty: 0.005
      scale_ema: 0.99
      affinity: {}
    constant_bc_multiplier: null
  protocol:
    reservation:
      seed: 911
      max_fraction: 0.1
      dependency_contract: raw_effective_finite_targets_v1
    reference:
      size: 1024
      seed: 912
    refresh_events: {}
  expected_counts:
    refresh_events: 198
  seed_overrides:
    202609171:
      protocol:
        refresh_events:
          bank: refresh_seed_1
    202609172:
      protocol:
        refresh_events:
          bank: refresh_seed_2
    202609173:
      protocol:
        refresh_events:
          bank: refresh_seed_3
    202609174:
      protocol:
        refresh_events:
          bank: refresh_seed_4
    202609175:
      protocol:
        refresh_events:
          bank: refresh_seed_5
arms:
  constant_1p5:
    identity: constant_bc_pool
    specification:
      identity: constant_bc_pool
      posterior: null
      constant_bc_multiplier: 1.5
    protocol:
      reservation:
        seed: 911
        max_fraction: 0.1
        dependency_contract: raw_effective_finite_targets_v1
      reference: null
      refresh_events: []
    expected_counts:
      refresh_events: 0
  fixed_after_warmup:
    identity: constant_bc_pool
    specification:
      identity: constant_bc_pool
      deviation_reason: Authorized prospective 1M common-pool strength/assignment comparison; unchanged
        prior host and calibration settings.
      posterior: null
      constant_bc_start_step: 10000
    protocol:
      run_id: fullwidth-1m-v1-td3-{environment}-s{seed}-constant_bc_pool
      reservation:
        target_size: 1024
        seed: 911
        max_fraction: 0.1
        dependency_contract: raw_effective_finite_targets_v1
      reference: null
      refresh_events: []
    expected_counts:
      refresh_events: 0
    run_id: fullwidth-1m-v1-td3-{environment}-s{seed}-constant_bc_pool
  native_full:
    identity: native_full
    specification:
      identity: native_full
      posterior: null
      constant_bc_multiplier: null
    protocol:
      reservation: null
      reference: null
      refresh_events: []
    expected_counts:
      refresh_events: 0
  native_pool:
    identity: native_pool
    specification:
      identity: native_pool
      posterior: null
      constant_bc_multiplier: null
    protocol:
      reservation:
        seed: 911
        max_fraction: 0.1
        dependency_contract: raw_effective_finite_targets_v1
      reference: null
      refresh_events: []
    expected_counts:
      refresh_events: 0
  posterior_affinity:
    bca: true
    identity: posterior_affinity
    specification:
      identity: posterior_affinity
      posterior:
        width_objective: matched
        affinity:
          mode: affinity
          ess_floor: 0.25
          tau_min: 0.0
          iterations: 32
  posterior_affinity_dose_permuted:
    bca: true
    identity: posterior_affinity_dose_permuted
    specification:
      identity: posterior_affinity_dose_permuted
      deviation_reason: Authorized prospective 1M common-pool strength/assignment comparison; unchanged
        prior host and calibration settings.

  <g id="text_18">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3d" x="68.04" y="26.176875" transform="rotate(-0 68.04 26.176875)">Did BCA specifically rescue the missing-label hole?</text>
  </g>
  <g id="text_19">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526678" x="68.04" y="39.102281" transform="rotate(-0 68.04 39.102281)">Final checkpoint • paired seed-level differences • the horizontal zero line means no effect</text>
  </g>
  <g id="text_20">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #526678" transform="translate(68.04 420.008525)">BCA effect = (BCA − native in hole) − (BCA − native in random). The prespecified rescue screen failed.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #526678" transform="translate(68.04 429.526666)">The random control matches removal counts and coarse strata, not every state or reward distribution.</text>
  </g>

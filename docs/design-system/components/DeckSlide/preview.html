<div id="root"></div>
<script>
var B = window.BCA, h = React.createElement, useState = React.useState;
var QS = [["The models are defined. Before trusting any number on D4RL, check our implementation against the paper's own experiments.", "Is our WBCP code right?", "Paper Table 1: synthetic regression under covariate shift (γ = 1, n = 200, 10,000 trials). Table 2: a count loss at n = 10 and 250."], ["Answer to question 1: yes for Table 1 under shift (5.1% vs 5.0%), with two published numbers that don't follow from the paper's definitions. Table 2 at n = 250 is about 2 points high, partly unexplained. The rewrite also fixed a real defect.", "Does it hold on real critic scores?", "The same rules on a frozen TD3+BC critic's scores for hopper-medium, with independent rows and covariate tilts we impose: no shift, exact weights, estimated weights."], ["Answer to question 2: yes with no shift (4.8–4.9% of banks fail). Under shift, uniform BQ‑CP fails up to 100% while WBCP stays near 5%, 7–8% at strong shift, a finite-sample excess shown on hopper.", "Does BCA's own bank keep the guarantee?", "Everything so far drew independent rows. BCA originally calibrated on every row of about 3 withheld episodes, and rows within an episode are correlated."], ["Answer to question 3: only with thinned banks and a small K. Whole-episode banks fail 26–48%; K must come from the measured ρ, and the configured raise-K banks fail 17.7–23.4% on walker2d.", "Does it hold on every host?", "The dependence study used TD3+BC's critic. A different host trains a different critic, so its scores, and how they correlate within an episode, can differ."], ["Answer to question 4: independent-row banks hold on every host. Configured banks hold only where ρ is low, and the host moves ρ up to 8×, so K must be set per host × dataset.", "Is the band measuring the error the actor uses?", "Questions 1–4 asked whether the band certifies its own score. Now: is that score the error the actor acts on?"], ["Answer to question 5: not on TD3+BC. A min band misses Q1's error in 8–82% of banks; a Q1 band holds (4–6%).", "Does the actor use the measurement?", "Whatever the band certifies, the actor feels it only through the dose. How much does the dose actually vary from row to row?"], ["Answer to question 6: by a post hoc reading, barely. Through today's hook, a valid band reaches the actor almost as uniform extra BC (dose ≈ 1.3, row SD 0.017–0.050).", "Where should the signal go?", "Signal-study step 4, pre-registered October 2 with no outcomes yet, tests three placements in the known-MDP harness."]], BL = [["1", "Is our WBCP code right?", "Yes for Table 1 under shift; Table 2 about 2 points high at n = 250", "Paper reproductions"], ["2", "Does it hold on real critic scores?", "Yes with no shift; WBCP near 5% under shift, 7–8% at strong shift", "Hopper, independent rows"], ["3", "Does BCA's own bank keep it?", "Only thinned banks with small K; whole episodes fail 26–48%", "TD3+BC, 5 healthy datasets"], ["4", "Does it hold on every host?", "Independent rows yes; configured banks fail on walker2d and pen-human", "All four hosts"]];
var cell = { border: 0, padding: '8px 12px 8px 0', fontSize: '24px', background: 'none', color: 'var(--deck-ink)', fontFamily: 'var(--font-deck-sans)', fontWeight: 400, verticalAlign: 'top' };
function Demo() {
  var s = useState(0), q = s[0], set = s[1];
  return h('div', { style: { display: 'flex', gap: '16px', alignItems: 'flex-start' } },
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
      h(B.DeckSlide, { scale: 0.234, progress: { current: q + 1, total: 7 }, kicker: 'Part 3 \u00b7 Question ' + (q + 1) + ' of 7', lead: QS[q][0], title: QS[q][1], body: QS[q][2] }),
      h('div', { className: 'transport' },
        h(B.Button, { variant: 'ghost', disabled: q === 0, onClick: function () { set(q - 1); } }, 'Previous'),
        h(B.Button, { disabled: q === 6, onClick: function () { set(q + 1); } }, 'Next'),
        h('span', { className: 'tlabel' }, 'Question ' + (q + 1) + ' of 7'))),
    h(B.DeckSlide, { kind: 'paper', scale: 0.234, kicker: 'Part 4 \u00b7 What it adds up to', title: 'What the dots add up to',
      caution: "Not yet shown: any effect on return, the adaptive training loop, coverage at the actor's own actions.",
      footnote: 'All D4RL evidence: one frozen 100k-update critic per host \u00d7 dataset, one seed; deployment runs 1M updates.' },
      h('table', { style: { width: '100%', borderCollapse: 'collapse' } }, h('tbody', null,
        h('tr', null, ['#', 'Question', 'Answer', 'Scope'].map(function (x) { return h('th', { key: x, style: Object.assign({}, cell, { fontWeight: 600 }) }, x); })),
        BL.map(function (r, i) { return h('tr', { key: i, style: { background: i === 1 ? 'var(--deck-row)' : 'none' } }, r.map(function (x, j) { return h('td', { key: j, style: cell }, x); })); })))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

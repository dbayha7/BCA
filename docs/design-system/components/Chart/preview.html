<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart</title>
<style>
  body { margin: 0; padding: 16px; }
</style>
</head>
<body>
<figure class="chartbox" style="margin:0">
  <svg class="chart" viewBox="0 0 560 304" role="img" aria-label="Push by throttle in the two worlds">
  <line class="grid" x1="48" x2="544" y1="208.0" y2="208.0"/><line class="grid" x1="48" x2="544" y1="160.0" y2="160.0"/><line class="grid" x1="48" x2="544" y1="112.0" y2="112.0"/><line class="grid" x1="48" x2="544" y1="64.0" y2="64.0"/><line class="grid" x1="48" x2="544" y1="16.0" y2="16.0"/>
  <line class="axis" x1="48" x2="544" y1="256" y2="256"/><line class="axis" x1="48" x2="48" y1="16" y2="256"/>
  <text class="tick" x="40" y="260" text-anchor="end">0</text><text class="tick" x="40" y="212.0" text-anchor="end">0.2</text><text class="tick" x="40" y="164.0" text-anchor="end">0.4</text><text class="tick" x="40" y="116.0" text-anchor="end">0.6</text><text class="tick" x="40" y="68.0" text-anchor="end">0.8</text><text class="tick" x="40" y="20.0" text-anchor="end">1</text><text class="tick" x="48" y="274" text-anchor="middle">0%</text><text class="tick" x="147.2" y="274" text-anchor="middle">20%</text><text class="tick" x="246.4" y="274" text-anchor="middle">40%</text><text class="tick" x="345.6" y="274" text-anchor="middle">60%</text><text class="tick" x="444.8" y="274" text-anchor="middle">80%</text><text class="tick" x="544.0" y="274" text-anchor="middle">100%</text>
  <text class="axlab" x="296" y="298" text-anchor="middle">Throttle of one thruster</text>
  <text class="axlab" transform="translate(12 136) rotate(-90)" text-anchor="middle">Push</text>
  <line class="knee k80" x1="444.8" x2="444.8" y1="16" y2="256"/>
  <path class="ln-cost" d="M48.0,256.0 L97.6,255.3 L147.2,253.1 L196.8,249.5 L246.4,244.5 L296.0,238.0 L345.6,230.1 L395.2,220.7 L444.8,209.9 L494.4,197.7 L544.0,184.0"/>
  <path class="ln-nostall" d="M48,256 L544,16"/>
  <path class="ln-stall" d="M48,256 L444.8,64.0 L544,136.0"/>
  <circle class="pt-stall" cx="494.4" cy="100.0" r="4.5"/><circle class="pt-stall" cx="544" cy="136.0" r="4.5"/>
  <text class="lab" x="436" y="30" text-anchor="end">No-stall world: push keeps rising</text>
  <text class="lab" x="536" y="160.0" text-anchor="end">Stalling world: 0.65 at 90%, 0.5 at full</text>
  <text class="lab" x="250" y="226.0" text-anchor="middle">throttle cost 0.3 × throttle²</text>
  <text class="ann" x="450.8" y="246.4" text-anchor="start">80%: the knee</text>
</svg>
  <div class="legend">
    <span><i class="key line" data-world="stall"></i>Stalling world</span>
    <span><i class="key line" data-world="no_stall"></i>No-stall world</span>
    <span><i class="key dots"></i>Throttle cost</span>
  </div>
  <figcaption>Push of one thruster by throttle. At or below 80% the two worlds are identical; past it the stalling world's push falls by 1.5 for every unit of throttle.</figcaption>
</figure>
</body>
</html>
